<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb);
            text-align: center;
            padding-top: 60px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Explore Nature 🌿</h2>

        <img id="pic"
             src="https://picsum.photos/id/10/300/200">

        <br>

        <button id="change">Change Image</button>

    </div>

    <script>
        document.getElementById("change").addEventListener("click", function() {

            document.getElementById("pic").src =
                "https://picsum.photos/id/1015/300/200";

        });
    </script>

</body>
</html>
