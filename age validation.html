<!DOCTYPE html>
<html>
<head>
    <title>Age Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 350px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #5b21b6;
        }

        input {
            width: 90%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 15px 0;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 20px;
            background: #5b21b6;
            color: white;
            cursor: pointer;
        }

        #error {
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Age Check</h1>

        <p>Please enter your age</p>

        <input type="number" id="age" placeholder="Enter age">

        <br>

        <button id="check">Check Age</button>

        <p id="error"></p>

    </div>

    <script>
        document.getElementById("check").addEventListener("click", function() {

            let a = document.getElementById("age").value;

            if (a === "") {
                document.getElementById("error").textContent =
                    "Please enter your age!";
            } else {
                document.getElementById("error").textContent =
                    "Age entered successfully.";
            }

        });
    </script>

</body>
</html>
