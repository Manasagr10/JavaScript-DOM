<!DOCTYPE html>
<html>
<head>
    <title>Welcome Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 15px 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 20px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #msg {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Welcome 👋</h1>

        <p>Enter your name</p>

        <input type="text" id="name" placeholder="Your name">

        <br>

        <button id="submit">Submit</button>

        <p id="msg"></p>

    </div>

    <script>
        document.getElementById("submit").addEventListener("click", function() {

            let n = document.getElementById("name").value;

            document.getElementById("msg").textContent =
                "Welcome, " + n + "!";

        });
    </script>

</body>
</html>
