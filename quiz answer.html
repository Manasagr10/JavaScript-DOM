<!DOCTYPE html>
<html>
<head>
    <title>Quick Quiz</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(120deg, #84fab0, #8fd3f4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz {
            width: 430px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #166534;
        }

        .answer {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .answer:hover {
            background: #dcfce7;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="quiz">

        <h1>Quick Quiz</h1>

        <h3>Which language is used for web page structure?</h3>

        <button class="answer">Python</button>
        <button class="answer">HTML</button>
        <button class="answer">Java</button>
        <button class="answer">C++</button>

        <p id="result"></p>

    </div>

    <script>
        let b = document.querySelectorAll(".answer");

        b.forEach(function(btn) {

            btn.addEventListener("click", function() {

                if (btn.textContent === "HTML") {
                    document.getElementById("result").textContent =
                        "Correct Answer!";
                } else {
                    document.getElementById("result").textContent =
                        "Incorrect Answer!";
                }

            });

        });
    </script>

</body>
</html>
