<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111827;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .counter {
            text-align: center;
            background: #1f2937;
            padding: 40px;
            width: 350px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            color: #93c5fd;
        }

        #value {
            font-size: 60px;
            margin: 25px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #inc {
            background: #22c55e;
            color: white;
        }

        #dec {
            background: #ef4444;
            color: white;
        }

        #reset {
            background: #facc15;
            color: black;
        }
    </style>
</head>

<body>

    <div class="counter">

        <h1>Counter</h1>

        <div id="value">0</div>

        <button id="inc">Increase</button>

        <button id="dec">Decrease</button>

        <button id="reset">Reset</button>

    </div>

    <script>
        let c = 0;

        let v = document.getElementById("value");

        document.getElementById("inc").addEventListener("click", function() {
            c++;
            v.textContent = c;
        });

        document.getElementById("dec").addEventListener("click", function() {
            c--;
            v.textContent = c;
        });

        document.getElementById("reset").addEventListener("click", function() {
            c = 0;
            v.textContent = c;
        });
    </script>

</body>
</html>
