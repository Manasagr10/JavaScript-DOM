<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #f6d365, #fda085);
            margin: 0;
            padding: 50px;
        }

        .box {
            background: white;
            width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            color: #444;
        }

        li {
            list-style: none;
            background: #f5f5f5;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
        }

        .delete {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Task Manager</h1>

        <ul id="tasks">

            <li>
                Complete Assignment
                <button class="delete">Delete</button>
            </li>

            <li>
                Study JavaScript
                <button class="delete">Delete</button>
            </li>

            <li>
                Prepare for Exam
                <button class="delete">Delete</button>
            </li>

        </ul>

    </div>

    <script>
        let b = document.querySelectorAll(".delete");

        b.forEach(function(btn) {

            btn.addEventListener("click", function() {

                btn.parentElement.remove();

            });

        });
    </script>

</body>
</html>
