<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 350px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .product {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .product h2 {
            margin: 5px;
            color: #333;
        }

        .price {
            color: #764ba2;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4b5dcc;
        }

        #count {
            color: #764ba2;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🛍️ My Store</h1>

        <div class="product">
            <h2>Wireless Headphones</h2>
            <p class="price">₹1,499</p>

            <button id="cartBtn">Add to Cart</button>
        </div>

        <p>Items in Cart: <span id="count">0</span></p>

    </div>

    <script>
        let c = 0;

        document.getElementById("cartBtn").addEventListener("click", function() {
            c++;
            document.getElementById("count").textContent = c;
        });
    </script>

</body>
</html>
